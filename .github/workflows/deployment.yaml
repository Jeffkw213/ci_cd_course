name: deployment
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/*

jobs:
  auto_organization:
    runs-on: windows-latest
    name: Auto Organization
    env:
        JOB_VAR: Passing value
        SECRET_VAR: ${{secrets.SECRET_VAR}}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Auto Organization Message
        run: echo "Auto Organization"

      - name: Run Deployment Script
        run: |
          Write-Host "Running deployment script ..."
          & "$Env:GITHUB_WORKSPACE/deployment/main.ps1" -ParameterName "$JOB_VAR" -SecretName "$SECRET_VAR"
        shell: pwsh

    